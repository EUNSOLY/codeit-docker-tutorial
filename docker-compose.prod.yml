# docker-compose.prod.yml (EC2용)
services:
  postgres:
    container_name: compose-postgres-db
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}            # .env(= GitHub Secrets)에서 치환
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data

  spring-app:
    container_name: compose-spring-app
    image: ${DOCKERHUB_USERNAME}/codeit-tutorial:latest   # build 대신 Docker Hub 이미지
    ports:
      - "8082:8080"                      # 보안그룹에 열어둔 8082에 맞춤
    environment:
      SPRING_PROFILE: develop
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}   # properties의 root를 덮어씀
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres

volumes:
  db-data: