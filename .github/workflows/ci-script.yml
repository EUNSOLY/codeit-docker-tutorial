name: Java CI with Gradle
on:
  push:
    branches: ["261014_dockerfile_cicd"]

jobs:
  depoly:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: 프로그램 빌드
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: gradlew 실행권한 변경
        run: chmod +x ./gradlew

      - name: SpringBoot 프로그램 빌드
        run: ./gradlew clean build

      - name: 도커 이미지 빌드
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/docker-signle-container:latest .

      - name: 도커 허브 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PW }}

      - name: 도커 허브에 업로드
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/docker-signle-container