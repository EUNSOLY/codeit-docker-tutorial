name: Java CI with Gradle        # 워크플로우 이름 (GitHub Actions 탭에 표시됨)

# 261002_Docker_Github_CICD 브랜치에 push 혹은 PR가 merged시 동작
on:                              # 워크플로우를 실행시킬 이벤트(트리거)
  push:                          # push 이벤트 발생 시 실행 (PR이 merge되면 해당 브랜치에 push가 일어나므로 같이 동작)
    branches: ["261002_Docker_Github_CICD"]   # 이 브랜치에 push될 때만 실행

jobs:                                  # 워크플로우에서 실행할 작업(job)들의 묶음
  deploy:                              # job 이름 (임의로 지정, 예: build, test, deploy)
    runs-on: ubuntu-latest             # GitHub가 제공하는 최신 Ubuntu 가상머신에서 실행

    steps:                             # 이 job 안에서 순서대로 실행할 단계들
      - uses: actions/checkout@v3      # 내 레포 코드를 가상머신으로 내려받음 (git clone 같은 것) - 이 부분이 누락되면 가상머신엔 코드가 하나도 없음

      # 1. 프로그램 빌드(Java 빌드) - Set up JDK 17
      - name: Java 및 Docker 빌드를 위한 환경 설정            # 이 step의 이름 (Actions 로그에 표시됨)
        uses: actions/setup-java@v3                     # 이미 만들어진 공식 액션으로 Java 설치
        with:                                           # 위 액션에 넘겨줄 옵션
          java-version: '17'                            # 설치할 JDK 버전
          distribution: 'temurin'                       # JDK 배포판 종류 (Eclipse Temurin = OpenJDK 기반 무료 배포판)


      # 1-1. 권한 변경 - Run chmod to make gradlew executable
      - name: 프로그램 빌드(JAVA) - Java 빌드를 위해 gradlew 파일 권한 변경
        run: chmod +x ./gradlew                         # 개발 OS와는 무관 가상머신은 ubuntu 환경

      # 1-2. 프로그램 빌드 - Spring Boot Build
      - name: 애플리케이션 빌드
        run: ./gradlew clean build                      # clean: 이전 빌드 결과물 삭제 / build: 컴파일 + 테스트 + jar 생성 (build/libs/*.jar)

      # 2. Docker 이미지 빌드 - DockerFile 을 기반으로 Docker Image 빌드
      - name: 도커 이미지 빌드
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/codeit-tutorial:latest .
        # -t: 이미지 이름:태그 지정 (Docker Hub push를 위해 "아이디/레포명:태그" 형식)
        # . : 현재 위치(레포 루트)의 Dockerfile을 기준으로 빌드

      # 2-1. Docker Hub 로그인
      - name: 도커 허브 로그인
        uses: docker/login-action@v2                    # Docker 공식 로그인 액션 (셸 명령어가 아니므로 run이 아닌 uses)
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}   # Docker Hub 아이디 (레포 Settings > Secrets에 등록한 값)
          password: ${{ secrets.DOCKERHUB_PW }}         # Docker Hub 비밀번호 또는 Access Token

      # 2-2. Docker 이미지 Docker Hub에 업로드
      - name: 도커 허브 내 이미지 업로드
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/codeit-tutorial   # 태그 생략 시 :latest로 push (빌드한 이름과 일치해야 함)

      # 3. CD - GitHub Actions 가상머신의 공인 IP 확인 (보안그룹에 임시로 열어줄 IP)
      - name: GitHub Actions IP 확인
        id: ip                                            # 다른 step에서 steps.ip.outputs.ipv4로 꺼내 쓰기 위한 id
        uses: haythem/public-ip@v1.3


      # 3-1. IAM 엑세스 키로 AWS 권한 취득 (보안그룹 수정용)
      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2


      # 3-2. 보안그룹에 Actions IP의 22번 포트 임시 허용
      - name: 보안그룹에 Actions IP 추가
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
          

      # 3-3. prod compose를 docker-compose.yml 이름으로 준비
      - name: 배포용 compose 파일 준비
        run: |
          mkdir -p deploy
          cp docker-compose.prod.yml deploy/docker-compose.yml   # 레포 원본은 그대로, 복사본 이름만 변경

      # 3-4. EC2용 compose 파일을 EC2로 복사
      - name: compose 파일 EC2로 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          source: "deploy/docker-compose.yml"
          target: "~/codeit-tutorial"
          strip_components: 1        # deploy/ 폴더는 빼고 파일만 올림

      # 3-5. EC2 접속 → .env 생성 → 새 이미지 받아서 compose 실행
      - name: EC2에서 compose 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            cd ~/codeit-tutorial
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF
            docker compose pull       # 최신 이미지 받기
            docker compose up -d      # 바뀐 컨테이너만 재생성
            docker image prune -f     # 이전 버전 이미지 정리                    # 이전 버전 이미지 정리
            

      # 3-6. 임시로 연 22번 포트 닫기 (앞 단계가 실패해도 반드시 실행)
      - name: 보안그룹에서 Actions IP 삭제
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32