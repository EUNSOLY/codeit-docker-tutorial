name: Java CI with Gradle - docker-single-container-CI
on:
  push:
    branches: ["261014_dockerfile_cicd"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: gradlew 실행권한 변경
        run: chmod +x ./gradlew

      - name: SpringBoot 프로그램 빌드
        run: ./gradlew clean build

      - name: 도커 이미지 빌드
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/docker-single-container:latest .

      - name: 도커 허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PW }}

      - name: 도커 허브에 업로드
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/docker-single-container

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 깃허브 가상머신 IP 가져오기
        id: ip
        uses: haythem/public-ip@v1.3

      - name: AWS 접근 권한 취득
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: AWS GitHub IP 보안그룹 추가
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port ${{ secrets.EC2_SSH_PORT }} \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: AWS EC2 연결
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          timeout: 60s
          script: |
            sudo docker stop docker-single-container || true 
            sudo docker rm docker-single-container || true 
            sudo docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/docker-single-container:latest || true 
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/docker-single-container:latest
            sudo docker run -it -d -p 8082:8080 --name docker-single-container ${{ secrets.DOCKERHUB_USERNAME }}/docker-single-container
            

      - name: AWS 내 임시 보안그룹 제거
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
          --group-id ${{ secrets.AWS_SG_ID }} \
          --protocol tcp --port ${{ secrets.EC2_SSH_PORT }} \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32